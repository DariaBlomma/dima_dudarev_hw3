<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sneaker store</title>
</head>
<body>
    <link rel="stylesheet" href="style.css">
    <header>
        <span class="logo"><i><span class="sneaker">SNEAKER</span>STORE</i></span>
        <ul class="nav">
            <li>HOME</li>
            <li class="active">CATALOG</li>
            <li>MEN</li>
            <li>WOMEN</li>
            <li class="sale">SALE</li>
        </ul>
        <div class="upper-buttons">
            <div>#</div>
            <div>#</div>
            <div>#</div>
        </div>
    </header>
    <div class="container">
        <div class="settings">
            <div class="filters">
                <p>FILTERS</p>
                <div class="settings-sign">#</div>
            </div>
            <div class="prices">
                <p>PRICE RANGE</p>
                <div class="controler">-----------------</div>
            </div>
            <div class="brand">
                <p>BRAND</p>
                <ul class="brand-list">
                    <li>#  Nike</li>
                    <li>#  Adidas</li>
                    <li>#  Puma</li>
                </ul>
            </div>
            <div class="size">
                <div>7</div>
                <div>7.5</div>
                <div>8</div>
                <div>8.5</div>
                <div>9</div>
                <div>9.5</div>
                <div>10</div>
                <div>10.5</div>
                <div>11</div>
                <div>11.5</div>
                <div>12</div>
                <div>13</div>
            </div>
            <button class="clear=filters">CLEAR FILTERS #</button>
        </div>
        <div class="items">
            <div class="results">
                <span class="display-results">Showing 6 results</span>
                <button class="sorting">Sort by: Popularity</button>
            </div>
            <div class="shoes">
                <div class="shoe-1"><img class="blackshoe" src="pics/blackshoe.jpg"></img></div>
                <div class="shoe-2">#</div>
                <div class="shoe-3">#</div>
                <div class="shoe-4">#</div>
                <div class="shoe-5">#</div>
                <div class="shoe-6">#</div>
            </div>
        </div>
    </div>
</body>
</html>
